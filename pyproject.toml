[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "decodo-llamaindex"
version = "0.1.0"
description = "Decodo Web Scraping API integration for LlamaIndex — readers and tools for scraping URLs and search engines."
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.9"
authors = [
    { name = "Decodo", email = "support@decodo.com" },
]
keywords = ["decodo", "llamaindex", "llama-index", "web-scraping", "rag"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Internet :: WWW/HTTP",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = [
    "llama-index-core>=0.10.0",
    "httpx>=0.27.0",
]

[project.urls]
Homepage = "https://decodo.com"
Repository = "https://github.com/Decodo/decodo-llamaindex"
Documentation = "https://decodo.com/docs"
"Bug Tracker" = "https://github.com/Decodo/decodo-llamaindex/issues"

[tool.hatch.build.targets.wheel]
packages = ["src/decodo_llamaindex"]

[tool.hatch.build.targets.sdist]
include = [
    "src/",
    "README.md",
    "pyproject.toml",
]
