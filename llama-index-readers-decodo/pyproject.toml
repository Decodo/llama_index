[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "llama-index-readers-decodo"
version = "0.1.1"
description = "Decodo web scraping API reader for LlamaIndex — load web pages and search results as Documents."
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.10"
authors = [
    { name = "Decodo", email = "support@decodo.com" },
]
keywords = ["decodo", "llamaindex", "llama-index", "web-scraping", "readers"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Internet :: WWW/HTTP",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = [
    "llama-index-core>=0.13.0,<0.15",
    "httpx>=0.27.0",
]

[project.optional-dependencies]
dev = [
    "pytest",
    "pytest-mock",
    "black",
    "ruff",
    "mypy",
]

[project.urls]
Homepage = "https://decodo.com"
Repository = "https://github.com/run-llama/llama_index"

[tool.llamahub]
class_name = "DecodoWebReader"
author = "Decodo"

[tool.hatch.build.targets.wheel]
packages = ["llama_index"]
